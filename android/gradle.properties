# Project-wide Gradle settings.
# This is required for older plugins that don't support namespace.
android.jetifier.ignorelist=com.google.android.odml:image
android.useAndroidX=true
android.enableJetifier=true

# Increase Gradle daemon JVM heap to avoid Java heap space issues during large builds
org.gradle.jvmargs=-Xmx4g -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiler daemon memory
kotlin.daemon.jvm.options=-Xmx2g
